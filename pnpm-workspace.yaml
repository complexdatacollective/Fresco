# Generated by scripts/mirror-app.mjs — edit apps/fresco in the
# network-canvas monorepo, not this file.
packages:
  - '.'

# Supply-chain cooldown: refuse dependency versions younger than 24h.
minimumReleaseAge: 1440
minimumReleaseAgeStrict: false
# '@codaco/*' is a permanent exemption: these are first-party packages whose
# releases we control, and a release mirrors here the moment they are published
# — so the cooldown would otherwise block every release for a day.
minimumReleaseAgeExclude:
  - '@codaco/*'

autoInstallPeers: true

allowBuilds:
  '@parcel/watcher': true
  '@prisma/engines': true
  '@tailwindcss/oxide': true
  core-js-pure: true
  esbuild: true
  prisma: true
  sharp: true
  unrs-resolver: true
  '@posthog/cli': false
  core-js: false
  msgpackr-extract: false
  protobufjs: false

# Keep security-sensitive transitives on patched versions when upstream
# manifests still pin vulnerable releases.
overrides:
  # Packages changed since fresco@4.1.5 (and their dependents), bundled by the hotfix lane (local tarballs).
  '@codaco/fresco-ui': 'file:vendor/codaco-fresco-ui-6.4.0.tgz'
  '@codaco/interview': 'file:vendor/codaco-interview-9.0.1.tgz'
  '@codaco/protocol-utilities': 'file:vendor/codaco-protocol-utilities-4.0.0.tgz'
  # Packages changed since fresco@4.1.4 (and their dependents), bundled by the hotfix lane (local tarballs).
  'effect@3.17.7': '^3.22.1'
  fast-uri: '^3.1.4'
  find-my-way: '^9.7.0'
  # Next pins an exact PostCSS version; this is resolved from the root catalog.
  postcss: '^8.5.26'
  sharp: '^0.35.3'
  valibot: '^1.4.2'
