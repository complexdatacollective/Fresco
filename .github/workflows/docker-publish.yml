# Fresco is developed in the network-canvas monorepo; this repository receives
# its source through the release sync, which pushes to `main`. That push is the
# release event, so it is what builds and publishes the image.
name: Build and Publish Docker Image

permissions:
  contents: read
  packages: write

on:
  push:
    branches: [main]

concurrency:
  group: docker-publish-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build-and-publish:
    runs-on: ubuntu-latest
    steps:
      - name: Check out the code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      # The synced package.json is the single source of truth for the release
      # version — the monorepo's changeset run has already bumped it.
      - name: Read version from package.json
        id: version
        run: |
          VERSION=$(jq -r .version package.json)
          if [ -z "$VERSION" ] || [ "$VERSION" = "null" ]; then
            echo "::error::Could not read a version from package.json"
            exit 1
          fi
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and Push Multi-platform Docker Image
        uses: docker/build-push-action@v7
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: true
          tags: |
            ghcr.io/complexdatacollective/fresco:${{ steps.version.outputs.version }}
            ghcr.io/complexdatacollective/fresco:latest
          cache-from: |
            type=gha
            type=registry,ref=ghcr.io/complexdatacollective/fresco:buildcache
          cache-to: |
            type=gha,mode=max
            type=registry,ref=ghcr.io/complexdatacollective/fresco:buildcache,mode=max,image-manifest=true
