[build]
publish = ".next"
command = "pnpm build:platform"
ignore = "bash scripts/netlify-should-build.sh"

# Branch deploys and deploy previews never see the production database: the
# site sets DATABASE_URL and DATABASE_URL_UNPOOLED for production alone. A pull
# request's preview gets a Neon branch of its base's database
# (.github/workflows/fresco-preview-database.yml), and `build:preview` migrates
# that database only when PREVIEW_DATABASE_BRANCH says it is the preview's own.
[context.branch-deploy]
command = "pnpm build:preview"

[context.deploy-preview]
command = "pnpm build:preview"
ignore = "bash scripts/netlify-should-build.sh || (cd \"$(git rev-parse --show-toplevel)\" && if test -n \"$CACHED_COMMIT_REF\" && test \"$CACHED_COMMIT_REF\" != \"$COMMIT_REF\" && git diff --quiet \"$CACHED_COMMIT_REF\" \"$COMMIT_REF\" -- apps/fresco/netlify.toml package.json pnpm-lock.yaml pnpm-workspace.yaml && npx --yes \"turbo@$(node -p \"require('./package.json').devDependencies.turbo\")\" query affected --tasks build --packages fresco --base \"$CACHED_COMMIT_REF\" --head \"$COMMIT_REF\" --exit-code; then true; else false; fi)"
